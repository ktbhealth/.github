name: loc

# Weekly + manual lines-of-code report across all ktbhealth repos.
# Thin caller — the tool and this org's config are distributed as
# tamias packs by the 9aia/cypera reusable workflow (pinned to
# cypera tag v0.2.4); the org config lives in packs/loc/ and is
# published to the org registry as 9aia:ktb-loc-config.
#
# Auth: docs publish uses the ci.ktbhealth.workers.dev token broker
# (lasius-bot GitHub App, docs-scoped) — needs TOKEN_MINT_SECRET secret.
# LOC_READ_TOKEN (optional PAT) only widens repo counting to the private
# repos (website-draft, presentation-draft).

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

jobs:
  loc:
    uses: 9aia/cypera/.github/workflows/loc-org.yml@v0.2.4
    with:
      config_ref: 9aia:ktb-loc-config@0.1.0
    # secrets: inherit only works within the same org/enterprise — this
    # reusable workflow lives in 9aia/cypera, so secrets must be mapped
    # explicitly or they resolve to empty strings.
    secrets:
      TOKEN_MINT_SECRET: ${{ secrets.TOKEN_MINT_SECRET }}
      LOC_READ_TOKEN: ${{ secrets.LOC_READ_TOKEN }}
      TAMIAS_REGISTRY_TOKEN: ${{ secrets.TAMIAS_REGISTRY_TOKEN }}
