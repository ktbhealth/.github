name: loc

# Weekly + manual lines-of-code report across all ktbhealth repos.
# Thin caller — the tool lives in 9aia/cypera (tools/loc + reusable
# workflows), pinned to tag loc-v3.
#
# Auth: docs publish uses the ci.ktbhealth.workers.dev token broker
# (lasius-bot GitHub App, docs-scoped) — needs TOKEN_MINT_SECRET secret.
# LOC_READ_TOKEN (optional PAT) only widens repo counting to the private
# repos (website-draft, presentation-draft).

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

jobs:
  loc:
    uses: 9aia/cypera/.github/workflows/loc-org.yml@loc-v3
    with:
      org: ktbhealth
      repos: .github docs presentation-draft product project slidev-theme-ktb storybook ui website-draft workspace
      docs_repo: ktbhealth/docs
      docs_outputs: |
        en=content/docs/en/developers/root/reference/codebase-metrics.mdx
        pt-BR=content/docs/pt-BR/developers/root/reference/codebase-metrics.mdx
      token_broker_url: https://ci.ktbhealth.workers.dev
      tool_ref: loc-v3
    # secrets: inherit only works within the same org/enterprise — this
    # reusable workflow lives in 9aia/cypera, so secrets must be mapped
    # explicitly or they resolve to empty strings.
    secrets:
      TOKEN_MINT_SECRET: ${{ secrets.TOKEN_MINT_SECRET }}
